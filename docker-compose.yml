
services:
  research-os:
    build: .
    container_name: research_os_v3
    ports:
      - "8500:8000"
    volumes:
      - .:/app
      - ./data:/data
    environment:
      - APP_ENV=development
      - PORT=8000
      - PYTHONUNBUFFERED=1
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
